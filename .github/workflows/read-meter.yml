name: read-meter

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: read-meter

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Read meter and merge into history
        shell: python
        run: |
          import json, re, subprocess, time, urllib.parse, urllib.request

          URL = "https://www.wap.cnyiot.com/nat/pay.aspx?mid=19100424977"
          MERGE_WINDOW = 10 * 60 * 1000
          MAX_ENTRIES = 2200
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          Q = urllib.parse.quote(URL, safe="")

          # cnyiot 在阿里云 WAF 后面,会拒数据中心/海外 IP(405)。依次尝试:
          # jina.ai 读取代理 → allorigins → codetabs → 直连(curl) → 直连(urllib)
          TARGETS = [
              ("urllib", "https://r.jina.ai/" + URL),
              ("urllib", "https://api.allorigins.win/raw?url=" + Q),
              ("urllib", "https://api.codetabs.com/v1/proxy?quest=" + Q),
              ("curl", URL),
              ("urllib", URL),
          ]

          def num(s):
              if s is None:
                  return None
              try:
                  return float(s)
              except ValueError:
                  return None

          def extract(text):
              def grab(label):
                  m = re.search(label + r"[\s\S]{0,160}?(?:<label[^>]*>|[:：]\s*)([0-9]+(?:\.[0-9]+)?)", text)
                  return m.group(1) if m else None
              kwh, money, price = num(grab("剩余电量")), num(grab("剩余金额")), num(grab("综合费用"))
              return (kwh, money, price) if money is not None else None

          reading, source = None, None
          for how, target in TARGETS:
              for attempt in range(2):
                  try:
                      if how == "curl":
                          p = subprocess.run(
                              ["curl", "-sS", "-L", "--max-time", "20", "-A", UA,
                               "-H", "Accept: text/html,application/xhtml+xml,*/*;q=0.8",
                               "-H", "Accept-Language: zh-CN,zh;q=0.9", target],
                              capture_output=True, text=True, timeout=25)
                          body = p.stdout if p.returncode == 0 else ""
                      else:
                          req = urllib.request.Request(target, headers={
                              "User-Agent": UA,
                              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                              "Accept-Language": "zh-CN,zh;q=0.9",
                              **({"X-Return-Format": "html"} if "r.jina.ai" in target else {})})
                          with urllib.request.urlopen(req, timeout=20) as r:
                              body = r.read().decode("utf-8", "replace")
                      parsed = extract(body)
                      if parsed:
                          reading, source = parsed, f"{how}:{target}"
                          break
                      print(f"[{target}] fetched but no match ({len(body)} bytes)")
                  except Exception as e:
                      print(f"[{target}] attempt {attempt + 1} failed: {e}")
                  time.sleep(5)
              if reading:
                  break

          if reading is None:
              raise SystemExit("meter read failed via all sources: " + ", ".join(t for _, t in TARGETS))

          kwh, money, price = reading
          print(f"source: {source}")
          print(f"recorded: money={money} kwh={kwh} price={price}")

          try:
              with open("history.json", "r", encoding="utf-8") as f:
                  hist = json.load(f)
          except Exception:
              hist = []
          now = int(time.time() * 1000)
          entry = {"ts": now, "kwh": kwh, "money": money, "price": price}
          last = hist[-1] if hist else None
          if last and now - last["ts"] < MERGE_WINDOW:
              hist[-1] = entry
          else:
              hist.append(entry)
          with open("history.json", "w", encoding="utf-8") as f:
              json.dump(hist[-MAX_ENTRIES:], f, ensure_ascii=False, separators=(",", ":"))

      - name: Commit and push
        run: |
          git config user.name "meter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "meter reading $(date -u +%FT%TZ)"
            git push
          fi
